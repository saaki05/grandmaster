[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lsmkv"
version = "0.2.0"
description = "LSM-tree key-value store with Raft replication, written from scratch"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["lsmkv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E731"]
